# Sense Remote: Windows (x64) + macOS (yalniz Apple Silicon) derlemesi.
# RustDesk'in flutter-build.yml dosyasindaki Windows ve macOS adimlarindan sadelestirildi:
# Apple/Microsoft sertifikasi, notarization, MSI, Linux/Android/iOS ve Windows arm64 yok.
# Windows ciktisi imzasiz. macOS ciktisi ad-hoc imzali ya da (SENSE_MAC_SIGN=cert) kalici,
# kendinden imzali sertifikayla imzali (Apple Developer ID yok, ucretsiz kural).
# Etiket derlemesi her kurulum dosyasi icin YAPI BEYANI uretir ve yapi anahtariyla imzalar
# (.github/scripts/sense-sign-build.sh); istemci guncellemeyi bu imza olmadan kurmaz.
# Sirlar yalniz GitHub ortamlarinda: "surum" (yapi anahtari; yalniz v* etiketi) ve "imza"
# (Mac sertifikasi; master + v* etiketi). Kurulumu: tools/sense-keys/README.md.
# PR'larda CALISMAZ (2026-11-21): PR kontrolu sense-pr.yml'de (Linux, yalniz degisen alan).
# Tam Windows + macOS derlemesi ve testler master'a gonderimde, etikette ve elle calisir.
name: Sense Remote build

on:
  workflow_dispatch:
    inputs:
      # Sense Remote: macOS paketini etiket atmadan denemek icin (Windows isi atlanir).
      only_macos:
        description: "Yalniz macOS paketini derle (Windows atlanir)"
        type: boolean
        default: false
      # Sense Remote: guncelleme denemeleri icin (901 -> 902). Yalniz 900-999, etikette
      # kullanilamaz; yayin surumu numarasi yalniz v<n> etiketinden gelir.
      deneme_surumu:
        description: "Deneme surum numarasi (900-999; bos = normal derleme)"
        type: string
        default: ""
  push:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "README.md"
    # Surum: v<n> etiketi (yalniz tam sayi) -> Windows + macOS derlemesi -> TASLAK GitHub surumu.
    tags: ["v*"]

permissions:
  contents: read

# Sense Remote: master ve etiket derlemesi yarida kesilmez (pes pese birlestirmede calisan
# kosu biter; kuyrukta yalniz en yeni commit bekler).
concurrency:
  group: sense-build-${{ github.ref }}
  cancel-in-progress: false

env:
  SCITER_RUST_VERSION: "1.75"
  MAC_RUST_VERSION: "1.81"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  FLUTTER_MACOS_ARM_VERSION: "3.44.9"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VERSION: "1.5.3"
  # Sense Remote surum numarasi (duz sayi); kurulum dosyalari SenseRemote-Kurulum-<n>.exe
  # ve SenseRemote-<n>.dmg.
  SENSE_VERSION: "1"
  # Panelin imza acik anahtar(lar)i: k1=<base64url>,k2=... (acik anahtar, sir degil). Repo
  # degiskeni (Settings > Variables) yoksa bos gelir: istemci her zarfi reddeder (unknown_key).
  SENSE_ENVELOPE_KEYS: ${{ vars.SENSE_ENVELOPE_KEYS }}
  # Yapi anahtarinin acik anahtar(lar)i, ayni bicim (acik anahtar, sir degil). Bossa istemci
  # hicbir guncellemeyi kabul etmez (build_unknown_key); etiket derlemesi bos cikmaz.
  SENSE_RELEASE_KEYS: ${{ vars.SENSE_RELEASE_KEYS }}
  # Sense Remote (G3-2): RustDesk'in Flutter motoru (rustdesk/engine, surum eki "main",
  # varlik kimligi 210168939, 2024-12-01). Ozet sabit: dosya degisirse derleme duser.
  # Motor guncellemesi ayri PR'da: yeni ozet + kimlik buraya, gerekce PR'a.
  ENGINE_WINDOWS_URL: "https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip"
  ENGINE_WINDOWS_SHA256: "ec8cabf36ee4ff24c8d98de25b00e70781eb03876265aee84d0fe554a110036e"
  # Sense Remote (G4-5): macOS isindeki NASM 2.16.03 zip dosyasinin sabit ozeti.
  NASM_MACOS_SHA256: "0d29bcd8a5fc617333f4549c7c1f93d1866a4a0915c40359e0a8585bb1a5aa75"

jobs:
  # Etiket surumu: bicim ve on kosullar derlemeden once denetlenir (etiket disinda atlanir).
  verify-tag:
    name: verify release tag
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      # Sense Remote (G3-3): yayin yalniz master'daki (incelenmis, CI'dan gecmis) commit'ten.
      - name: Checkout history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check that the tagged commit is on master
        shell: bash
        run: |
          git fetch --no-tags origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error title=Etiket master'da degil::'$GITHUB_REF_NAME' etiketi master'da olmayan bir commit'e ($GITHUB_SHA) atanmis. Surum yalniz master'daki commit'ten derlenir."
            exit 1
          fi
          echo "Etiketlenen commit master'da: $GITHUB_SHA"

      - name: Check tag, keys and API server
        id: check
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          KEYS: ${{ vars.SENSE_ENVELOPE_KEYS }}
          API_SERVER: ${{ vars.SENSE_API_SERVER }}
        run: |
          # v<n>: yalniz tam sayi, bastaki sifir yok (v1, v2, v10); v1.2, v01, v1-rc reddedilir.
          if ! [[ "$TAG" =~ ^v[1-9][0-9]{0,5}$ ]]; then
            echo "::error title=Gecersiz surum etiketi::'$TAG' kabul edilmez; etiket v<n> olmali (n tam sayi: v1, v2, v3 ...)."
            exit 1
          fi
          # Etiket derlemesi anahtarsiz cikmaz: istemci her zarfi reddederdi (unknown_key).
          if [ -z "$KEYS" ]; then
            echo "::error title=SENSE_ENVELOPE_KEYS bos::Etiket derlemesi panelin acik anahtari olmadan yapilmaz. Once repo degiskenini yazin (YAYIN_ADIMLARI adim 11)."
            exit 1
          fi
          # Surum derlemesi her zaman yerlesik panel adresini (https://remote.snsdpt.com) kullanir.
          if [ -n "$API_SERVER" ]; then
            echo "::error title=SENSE_API_SERVER tanimli::Etiket derlemesinde SENSE_API_SERVER tanimsiz olmali; yoksa istemci baska bir panele baglanir."
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # Etiket derlemesi yapi anahtarsiz cikmaz: istemci hicbir guncellemeyi dogrulayamazdi.
      # check-keys: bicim (k = SHA-256(acik anahtar) ilk 8 bayt); SENSE_ENVELOPE_KEYS ile kesisim
      # (ayni k ya da ayni acik anahtar: iki imza kurali tek imzaya duserdi); iki listede ortak
      # test vektorunun DENEME anahtar kimlikleri. Herhangi biri derlemeyi durdurur.
      - name: Check release keys
        shell: bash
        run: |
          if [ -z "$SENSE_RELEASE_KEYS" ]; then
            echo "::error title=SENSE_RELEASE_KEYS bos::Etiket derlemesi yapi anahtarinin acik anahtari olmadan yapilmaz. Once tools/sense-keys/yapi-anahtari-uret.sh calistirilir (tools/sense-keys/README.md)."
            exit 1
          fi
          bash .github/scripts/sense-sign-build.sh check-keys

      # Mac imza yolu etikette kesin olmali: cert ise parmak izi de tanimli olmali (sirlar Mac
      # isinde denetlenir; burada "imza" ortami yok).
      - name: Check macOS signing mode
        shell: bash
        env:
          MAC_SIGN: ${{ vars.SENSE_MAC_SIGN }}
          MAC_CERT_SHA1: ${{ vars.SENSE_MAC_CERT_SHA1 }}
        run: |
          case "$MAC_SIGN" in
            ""|adhoc)
              echo "::warning title=Mac imzasi ad-hoc::Bu surumde macOS paketi ad-hoc imzalanir; guncellemede Mac izinleri (Ekran Kaydi, Erisilebilirlik) duser."
              ;;
            cert)
              if ! [[ "$MAC_CERT_SHA1" =~ ^[0-9A-Fa-f]{40}$ ]]; then
                echo "::error title=SENSE_MAC_CERT_SHA1 eksik::SENSE_MAC_SIGN=cert iken SENSE_MAC_CERT_SHA1 40 hex olmali (tools/sense-keys/mac-sertifika-uret.sh yazar)."
                exit 1
              fi
              echo "Mac imzasi: sertifika (sha1 $MAC_CERT_SHA1)"
              ;;
            *)
              echo "::error title=SENSE_MAC_SIGN gecersiz::'$MAC_SIGN' kabul edilmez; cert ya da adhoc olmali."
              exit 1
              ;;
          esac

  # Her kosuda (hizli, Linux): imza ve anahtar betikleri shellcheck + birim testi (gecici deneme
  # anahtari, sahte gh; sir kullanmaz) ve deneme surumu girdisinin denetimi. Dusmesi derlemeyi
  # baslatmadan durdurur.
  preflight:
    name: signing scripts and inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      trial_version: ${{ steps.trial.outputs.version }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Check the trial version input
        id: trial
        shell: bash
        env:
          TRIAL: ${{ inputs.deneme_surumu }}
        run: |
          if [ -z "$TRIAL" ]; then
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ] || [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "::error title=Deneme surumu::deneme_surumu yalniz elle calistirmada ve etiket disinda kullanilir."
            exit 1
          fi
          if ! [[ "$TRIAL" =~ ^9[0-9]{2}$ ]]; then
            echo "::error title=Deneme surumu::deneme_surumu 900-999 arasinda olmali."
            exit 1
          fi
          echo "::notice title=Deneme derlemesi::Surum numarasi $TRIAL (deneme). Bu kosu yayin surumu uretmez, yapi beyani imzalamaz."
          echo "version=$TRIAL" >> "$GITHUB_OUTPUT"

      # Yapi anahtari tanimliysa (etiket disinda da) liste denetlenir: bozuk bicim, panel
      # anahtarlariyla kesisim ya da deneme anahtar kimligi derlemeyi baslatmadan durdurur.
      - name: Check the release key list
        if: ${{ vars.SENSE_RELEASE_KEYS != '' }}
        shell: bash
        run: bash .github/scripts/sense-sign-build.sh check-keys

      - name: Shellcheck the signing scripts
        shell: bash
        run: |
          shellcheck --version | sed -n 2p
          shellcheck .github/scripts/sense-sign-build.sh .github/scripts/sense-macos-package.sh \
            tools/sense-keys/*.sh

      - name: Test the signing scripts (trial key, fake gh)
        shell: bash
        run: bash tools/sense-keys/test.sh

  generate-bridge:
    needs: [verify-tag, preflight]
    # verify-tag etiket disinda atlanir; atlanmasi derlemeyi engellemez, basarisizligi engeller.
    if: ${{ !cancelled() && needs.preflight.result == 'success' && (needs.verify-tag.result == 'success' || needs.verify-tag.result == 'skipped') }}
    uses: ./.github/workflows/bridge.yml

  windows:
    name: windows-x86_64
    needs: [verify-tag, preflight, generate-bridge]
    if: ${{ !cancelled() && needs.generate-bridge.result == 'success' && !(github.event_name == 'workflow_dispatch' && inputs.only_macos) }}
    runs-on: windows-2022
    steps:
      # Etiket derlemesinde surum numarasi etiketten gelir (uygulamaya ve dosya adina gider).
      - name: Set version from tag
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        run: echo "SENSE_VERSION=${{ needs.verify-tag.outputs.version }}" >> "$GITHUB_ENV"

      # Deneme derlemesi (workflow_dispatch, deneme_surumu): numara preflight'ta denetlendi.
      - name: Set trial version
        if: ${{ needs.preflight.outputs.trial_version != '' }}
        shell: bash
        env:
          TRIAL_VERSION: ${{ needs.preflight.outputs.trial_version }}
        run: echo "SENSE_VERSION=$TRIAL_VERSION" >> "$GITHUB_ENV"

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri $env:ENGINE_WINDOWS_URL -OutFile windows-x64-release.zip
          # Sense Remote (G3-2): ozet tutmazsa derleme durur (dagitilan kurulum dosyasina girer).
          $actual = (Get-FileHash -Algorithm SHA256 windows-x64-release.zip).Hash.ToLowerInvariant()
          if ($actual -ne $env:ENGINE_WINDOWS_SHA256) {
            Write-Output "::error title=Motor ozeti tutmuyor::beklenen $env:ENGINE_WINDOWS_SHA256, gelen $actual"
            exit 1
          }
          Write-Output "Motor SHA-256 dogrulandi: $actual"
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      # Sense Remote: Dart testleri (kurulum ekrani dahil) Windows PR'larinda da calissin.
      - name: Run the Dart tests
        working-directory: flutter
        run: flutter test --timeout 60s

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: windows-2022

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        shell: bash
        run: |
          if ! $VCPKG_ROOT/vcpkg install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do echo "$_1:"; cat "$_1"; done
            exit 1
          fi

      # Sense Remote: anahtarsiz derleme surer ama panelden gelen hicbir yetki uygulanmaz.
      # G2-9: etiket (yayin) derlemesinde anahtarsizlik hata; k kimlikleri loga yazilir ki
      # panelin GET /signing-key ciktisiyla karsilastirilabilsin (acik anahtar kimligi, sir degil).
      - name: Check panel envelope keys
        shell: bash
        run: |
          if [ -z "$SENSE_ENVELOPE_KEYS" ]; then
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              echo "::error title=SENSE_ENVELOPE_KEYS bos::Yayin (etiket) derlemesi panel anahtari olmadan yapilamaz."
              exit 1
            fi
            echo "::warning title=SENSE_ENVELOPE_KEYS bos::Bu derleme panel zarflarini dogrulayacak anahtar icermiyor; istemci her zarfi reddeder (unknown_key). Yayin oncesi repo degiskenine panelin acik anahtarini yazin."
          else
            echo "SENSE_ENVELOPE_KEYS: $(echo "$SENSE_ENVELOPE_KEYS" | tr ',' '\n' | wc -l) anahtar"
            echo "k: $(echo "$SENSE_ENVELOPE_KEYS" | tr ',' '\n' | cut -d= -f1 | tr -d ' ' | paste -sd' ' -)"
          fi

      # Sense Remote: yapi anahtari (guncelleme imzasi) icin ayni kural. k degerleri panelin
      # SR_RELEASE_KEYS ayariyla ayni olmali (acik anahtar kimligi, sir degil).
      - name: Check release keys
        shell: bash
        run: |
          if [ -z "$SENSE_RELEASE_KEYS" ]; then
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              echo "::error title=SENSE_RELEASE_KEYS bos::Yayin (etiket) derlemesi yapi anahtari olmadan yapilamaz."
              exit 1
            fi
            echo "::warning title=SENSE_RELEASE_KEYS bos::Bu derleme yapi beyanlarini dogrulayacak anahtar icermiyor; istemci hicbir guncellemeyi kabul etmez (build_unknown_key). Yayin oncesi tools/sense-keys/yapi-anahtari-uret.sh calistirilir."
          else
            echo "SENSE_RELEASE_KEYS: $(echo "$SENSE_RELEASE_KEYS" | tr ',' '\n' | wc -l) anahtar"
            echo "k: $(echo "$SENSE_RELEASE_KEYS" | tr ',' '\n' | cut -d= -f1 | tr -d ' ' | paste -sd' ' -)"
          fi

      - name: Build
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk

      - name: Run the Rust tests
        shell: bash
        run: |
          FEATURES=$(python3 ./build.py --portable --flutter --skip-portable-pack --hwcodec --vram --print-features)
          cargo test --locked --release --lib --features "$FEATURES"

      - name: Build self-extracted executable
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          # Sense Remote: kurulan program SenseRemote.exe (install_me <APP_NAME>.exe bekler).
          mv ./rustdesk/rustdesk.exe ./rustdesk/SenseRemote.exe
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/SenseRemote.exe
          popd
          mkdir -p ./out
          # Sense Remote: kurulum dosyasi adi; "-Kurulum" adi kurulum ekranini acar.
          mv ./target/release/rustdesk-portable-packer.exe ./out/SenseRemote-Kurulum-${{ env.SENSE_VERSION }}.exe

      - name: Run the setup file tests
        shell: bash
        run: cargo test --locked --release -p rustdesk-portable-packer

      - name: Upload Windows build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sense-remote-windows-x86_64
          path: ./out/
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macos-${{ matrix.job.arch }}
    needs: [verify-tag, preflight, generate-bridge]
    # Windows oncelikli (karar 2026-11-16): Mac PR'larda calismaz; master'a gonderimde,
    # etiket (surum) derlemesinde ve elle (workflow_dispatch) calisir.
    # Sense Remote (K3-1): generate-bridge atlanmis verify-tag'a bagli; durum islevi
    # (!cancelled) olmadan GitHub bu isi de "skipped" sayiyordu (#12'den beri hic calismadi).
    if: ${{ !cancelled() && needs.generate-bridge.result == 'success' && github.event_name != 'pull_request' }}
    runs-on: ${{ matrix.job.os }}
    # Sense Remote: Mac sertifikasi sirlari "imza" ortaminda; ortam yalniz master ve v* etiketine
    # acik. Baska dalda (ya da SENSE_MAC_SIGN=cert degilken) ortam istenmez: is sirsiz calisir ve
    # paket betigi ad-hoc imzalar (dalda cert isteniyorsa uyariyla).
    environment: ${{ (vars.SENSE_MAC_SIGN == 'cert' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))) && 'imza' || '' }}
    strategy:
      fail-fast: false
      matrix:
        job:
          - { target: aarch64-apple-darwin, os: macos-26, arch: aarch64, extra-build-args: "--screencapturekit" }
    steps:
      # Etiket derlemesinde surum numarasi etiketten gelir (uygulamaya ve dosya adina gider).
      - name: Set version from tag
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        run: echo "SENSE_VERSION=${{ needs.verify-tag.outputs.version }}" >> "$GITHUB_ENV"

      # Deneme derlemesi (workflow_dispatch, deneme_surumu): numara preflight'ta denetlendi.
      - name: Set trial version
        if: ${{ needs.preflight.outputs.trial_version != '' }}
        shell: bash
        env:
          TRIAL_VERSION: ${{ needs.preflight.outputs.trial_version }}
        run: echo "SENSE_VERSION=$TRIAL_VERSION" >> "$GITHUB_ENV"

      # Sense Remote: Windows'taki kuralin aynisi (G2-9) - etikette anahtarsiz derleme durur.
      - name: Check panel envelope keys
        shell: bash
        run: |
          if [ -z "$SENSE_ENVELOPE_KEYS" ]; then
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              echo "::error title=SENSE_ENVELOPE_KEYS bos::Yayin (etiket) derlemesi panel anahtari olmadan yapilamaz."
              exit 1
            fi
            echo "::warning title=SENSE_ENVELOPE_KEYS bos::Bu derleme panel zarflarini dogrulayacak anahtar icermiyor; istemci her zarfi reddeder (unknown_key). Yayin oncesi repo degiskenine panelin acik anahtarini yazin."
          else
            echo "SENSE_ENVELOPE_KEYS: $(echo "$SENSE_ENVELOPE_KEYS" | tr ',' '\n' | wc -l) anahtar"
            echo "k: $(echo "$SENSE_ENVELOPE_KEYS" | tr ',' '\n' | cut -d= -f1 | tr -d ' ' | paste -sd' ' -)"
          fi

      # Sense Remote: yapi anahtari (guncelleme imzasi) icin ayni kural. k degerleri panelin
      # SR_RELEASE_KEYS ayariyla ayni olmali (acik anahtar kimligi, sir degil).
      - name: Check release keys
        shell: bash
        run: |
          if [ -z "$SENSE_RELEASE_KEYS" ]; then
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              echo "::error title=SENSE_RELEASE_KEYS bos::Yayin (etiket) derlemesi yapi anahtari olmadan yapilamaz."
              exit 1
            fi
            echo "::warning title=SENSE_RELEASE_KEYS bos::Bu derleme yapi beyanlarini dogrulayacak anahtar icermiyor; istemci hicbir guncellemeyi kabul etmez (build_unknown_key). Yayin oncesi tools/sense-keys/yapi-anahtari-uret.sh calistirilir."
          else
            echo "SENSE_RELEASE_KEYS: $(echo "$SENSE_RELEASE_KEYS" | tr ',' '\n' | wc -l) anahtar"
            echo "k: $(echo "$SENSE_RELEASE_KEYS" | tr ',' '\n' | cut -d= -f1 | tr -d ' ' | paste -sd' ' -)"
          fi

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      # Sense Remote: sertifika imza yolu her Mac kosusunda kucuk bir deneme paketiyle sinanir
      # (kosuda uretilen GECICI sertifika; gercek sir kullanmaz). Uzun derlemeden once dusmesi icin
      # burada.
      - name: Test the signing scripts (trial certificate)
        shell: bash
        run: bash tools/sense-keys/test.sh

      - name: Install build runtime
        run: |
          brew install llvm create-dmg
          command -v pkg-config &>/dev/null || brew install pkg-config

      - name: Install NASM
        run: |
          wget --tries=6 --waitretry=20 --retry-connrefused https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/macosx/nasm-2.16.03-macosx.zip
          # Sense Remote (G4-5): ozet tutmazsa adim durur (derleyici dagitilan pakete girer).
          # nasm.us ozet yayinlamiyor; deger resmi adresten indirilen dosyadan hesaplandi
          # (2026-11-21, 1686077 bayt, Last-Modified 2024-04-17).
          echo "${NASM_MACOS_SHA256}  nasm-2.16.03-macosx.zip" | shasum -a 256 -c -
          unzip nasm-2.16.03-macosx.zip
          sudo cp nasm-2.16.03/nasm /usr/local/bin/nasm
          nasm --version

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ matrix.job.arch == 'aarch64' && env.FLUTTER_MACOS_ARM_VERSION || env.FLUTTER_VERSION }}

      - name: Keep CocoaPods for Flutter 3.44 (arm64)
        if: ${{ matrix.job.arch == 'aarch64' }}
        run: flutter config --no-enable-swift-package-manager

      - name: Workaround for flutter issue
        shell: bash
        run: |
          cd "$(dirname "$(which flutter)")"
          sed -i -e 's/_setFramesEnabledState(false);/\/\/_setFramesEnabledState(false);/g' ../packages/flutter/lib/src/scheduler/binding.dart

      - name: Patch RustDesk sources for Flutter 3.44 (arm64)
        if: ${{ matrix.job.arch == 'aarch64' }}
        shell: bash
        run: |
          brew install gnu-sed
          export PATH="$(brew --prefix gnu-sed)/libexec/gnubin:$PATH"
          bash .github/patches/apply_flutter_3.44_source_patches.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.MAC_RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: ${{ matrix.job.os }}

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.job.arch == 'aarch64' && 'bridge-artifact-flutter-3.44' || 'bridge-artifact' }}
          path: ./

      - name: Run the Dart tests
        if: ${{ matrix.job.arch == 'aarch64' }}
        working-directory: flutter
        run: flutter test --timeout 60s

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        run: |
          if ! $VCPKG_ROOT/vcpkg install --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do echo "$_1:"; cat "$_1"; done
            exit 1
          fi

      - name: Build
        run: |
          if [ "${{ matrix.job.target }}" = "aarch64-apple-darwin" ]; then
            MIN_MACOS_VERSION="12.3"
            sed -i -e "s/MACOSX_DEPLOYMENT_TARGET\=[0-9]*.[0-9]*/MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}/" build.py
            sed -i -e "s/platform :osx, '.*'/platform :osx, '${MIN_MACOS_VERSION}'/" flutter/macos/Podfile
            sed -i -e "s/osx_minimum_system_version = \"[0-9]*.[0-9]*\"/osx_minimum_system_version = \"${MIN_MACOS_VERSION}\"/" Cargo.toml
            sed -i -e "s/MACOSX_DEPLOYMENT_TARGET = [0-9]*.[0-9]*;/MACOSX_DEPLOYMENT_TARGET = ${MIN_MACOS_VERSION};/" flutter/macos/Runner.xcodeproj/project.pbxproj
            echo "MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}" >> "$GITHUB_ENV"
          fi
          ./build.py --flutter --hwcodec --unix-file-copy-paste ${{ matrix.job.extra-build-args }}

      # Sense Remote: imza (ad-hoc ya da SENSE_MAC_SIGN=cert ile kalici sertifika) + hardened
      # runtime (Developer ID / notarization yok), dmg ve dmg iceriginin dogrulanmasi (codesign,
      # DR, spctl, ad, --version, boyut, SHA-256). Sirlar yalniz bu adima verilir; "imza" ortami
      # yoksa bos gelir.
      - name: Package (signed dmg) and verify
        shell: bash
        env:
          EXPECTED_BASE_VERSION: ${{ env.VERSION }}
          SENSE_MAC_SIGN: ${{ vars.SENSE_MAC_SIGN }}
          SENSE_MAC_CERT_SHA1: ${{ vars.SENSE_MAC_CERT_SHA1 }}
          SENSE_MAC_CERT_P12: ${{ secrets.SENSE_MAC_CERT_P12 }}
          SENSE_MAC_CERT_PASSWORD: ${{ secrets.SENSE_MAC_CERT_PASSWORD }}
        run: |
          bash .github/scripts/sense-macos-package.sh \
            ./flutter/build/macos/Build/Products/Release/SenseRemote.app \
            ./flutter/macos/Runner/Release.entitlements \
            "$SENSE_VERSION" \
            ./out

      - name: Upload macOS build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sense-remote-macos-${{ matrix.job.arch }}
          path: out/*.dmg
          if-no-files-found: error
          retention-days: 14

      # Sense Remote: Windows isindeki Rust testlerinin aynisi (ayni komut, Mac ozellikleriyle);
      # cfg(target_os = "macos") kodu yalniz burada sinanir. Paket yuklendikten sonra calisir:
      # test duserse is (ve etikette taslak surum) yine durur, ama dmg incelenebilir kalir.
      - name: Run the Rust tests
        shell: bash
        run: |
          FEATURES=$(./build.py --flutter --hwcodec --unix-file-copy-paste ${{ matrix.job.extra-build-args }} --print-features)
          cargo test --locked --release --lib --features "$FEATURES"

  # Etiket: SHA-256 + imzali yapi beyanlari uret, herkese ACIK OLMAYAN taslak GitHub surumu olustur
  # (yayinlamak insan adimi). Yapi anahtari yalniz bu iste, "surum" ortamindan gelir (ortam
  # yalniz v* etiketine acik).
  release-draft:
    name: draft release
    needs: [verify-tag, windows, macos]
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-24.04
    environment: surum
    permissions:
      contents: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Download Windows build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sense-remote-windows-x86_64
          path: ./release

      - name: Download macOS build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sense-remote-macos-aarch64
          path: ./release

      - name: Checksums
        shell: bash
        working-directory: release
        env:
          VERSION: ${{ needs.verify-tag.outputs.version }}
        run: |
          FILE="SenseRemote-Kurulum-${VERSION}.exe"
          DMG="SenseRemote-${VERSION}.dmg"
          for f in "$FILE" "$DMG"; do
            [ -f "$f" ] || { echo "::error::$f bulunamadi"; ls -la; exit 1; }
          done
          sha256sum "$FILE" "$DMG" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Gizli anahtar yalniz bu adimin ortaminda; betik onu gecici dosyada (umask 077) tutar,
      # cikista siler, loga yazmaz.
      - name: Sign build statements
        shell: bash
        env:
          SENSE_RELEASE_SIGNING_KEY: ${{ secrets.SENSE_RELEASE_SIGNING_KEY }}
          VERSION: ${{ needs.verify-tag.outputs.version }}
        run: |
          if [ -z "$SENSE_RELEASE_SIGNING_KEY" ]; then
            echo "::error title=Yapi anahtari yok::'surum' ortaminda SENSE_RELEASE_SIGNING_KEY sirri tanimli degil (tools/sense-keys/README.md)."
            exit 1
          fi
          for f in "SenseRemote-Kurulum-${VERSION}.exe" "SenseRemote-${VERSION}.dmg"; do
            bash .github/scripts/sense-sign-build.sh sign "release/$f" "$VERSION" "$GITHUB_SHA" \
              "$GITHUB_RUN_ID" "release/$f.yapi.json"
          done

      # Kendi urettigi imzayi, gizli anahtar OLMADAN, istemciye gomulen acik anahtarla dogrular.
      - name: Verify build statements with the public keys
        shell: bash
        env:
          VERSION: ${{ needs.verify-tag.outputs.version }}
        run: |
          for f in "SenseRemote-Kurulum-${VERSION}.exe" "SenseRemote-${VERSION}.dmg"; do
            bash .github/scripts/sense-sign-build.sh verify "release/$f" "release/$f.yapi.json"
          done

      - name: Draft release
        shell: bash
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify-tag.outputs.version }}
          REPO: ${{ github.repository }}
          MAC_SIGN: ${{ vars.SENSE_MAC_SIGN }}
        run: |
          FILE="SenseRemote-Kurulum-${VERSION}.exe"
          DMG="SenseRemote-${VERSION}.dmg"
          if [ "$MAC_SIGN" = "cert" ]; then
            MAC_NOTE="kalici, kendinden imzali sertifikayla imzali"
          else
            MAC_NOTE="ad-hoc imzali"
          fi
          # --draft: herkese acik degil; yayinlamayi ekip elle yapar.
          gh release create "$TAG" "$FILE" "$DMG" "$FILE.yapi.json" "$DMG.yapi.json" SHA256SUMS.txt \
            --repo "$REPO" --draft --verify-tag \
            --title "Sense Remote ${VERSION}" \
            --notes "Taslak. Imzasiz Windows kurulum dosyasi ve ${MAC_NOTE} (notarization yok) macOS Apple Silicon paketi; dogrulama icin SHA256SUMS.txt ve yapi beyanlari (*.yapi.json, yapi anahtariyla imzali). Surum notlari yayindan once eklenir."
