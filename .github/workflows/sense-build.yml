# Sense Remote: Windows (x64) + macOS (yalniz Apple Silicon) derlemesi.
# RustDesk'in flutter-build.yml dosyasindaki Windows ve macOS adimlarindan sadelestirildi:
# imzalama, surum yayini, MSI, Linux/Android/iOS ve Windows arm64 yok.
# Ciktilar imzasizdir ve yalniz ekip cihazlarinda deneme icindir.
# PR'larda yalniz Windows; macOS master'da ve elle calisir (Windows oncelikli).
name: Sense Remote build

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "README.md"
  push:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "README.md"
    # Surum: v<n> etiketi (yalniz tam sayi) -> Windows derlemesi -> TASLAK GitHub surumu.
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: sense-build-${{ github.ref }}
  cancel-in-progress: true

env:
  SCITER_RUST_VERSION: "1.75"
  MAC_RUST_VERSION: "1.81"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  FLUTTER_MACOS_ARM_VERSION: "3.44.9"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VERSION: "1.5.3"
  # Sense Remote surum numarasi (duz sayi); kurulum dosyasi SenseRemote-Kurulum-<n>.exe.
  SENSE_VERSION: "1"
  # Panelin imza acik anahtar(lar)i: k1=<base64url>,k2=... (acik anahtar, sir degil). Repo
  # degiskeni (Settings > Variables) yoksa bos gelir: istemci her zarfi reddeder (unknown_key).
  SENSE_ENVELOPE_KEYS: ${{ vars.SENSE_ENVELOPE_KEYS }}

jobs:
  # Etiket surumu: bicim ve on kosullar derlemeden once denetlenir (etiket disinda atlanir).
  verify-tag:
    name: verify release tag
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Check tag, keys and API server
        id: check
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          KEYS: ${{ vars.SENSE_ENVELOPE_KEYS }}
          API_SERVER: ${{ vars.SENSE_API_SERVER }}
        run: |
          # v<n>: yalniz tam sayi, bastaki sifir yok (v1, v2, v10); v1.2, v01, v1-rc reddedilir.
          if ! [[ "$TAG" =~ ^v[1-9][0-9]{0,5}$ ]]; then
            echo "::error title=Gecersiz surum etiketi::'$TAG' kabul edilmez; etiket v<n> olmali (n tam sayi: v1, v2, v3 ...)."
            exit 1
          fi
          # Etiket derlemesi anahtarsiz cikmaz: istemci her zarfi reddederdi (unknown_key).
          if [ -z "$KEYS" ]; then
            echo "::error title=SENSE_ENVELOPE_KEYS bos::Etiket derlemesi panelin acik anahtari olmadan yapilmaz. Once repo degiskenini yazin (yayin adimi 6a)."
            exit 1
          fi
          # Surum derlemesi her zaman yerlesik panel adresini (https://remote.snsdpt.com) kullanir.
          if [ -n "$API_SERVER" ]; then
            echo "::error title=SENSE_API_SERVER tanimli::Etiket derlemesinde SENSE_API_SERVER tanimsiz olmali; yoksa istemci baska bir panele baglanir."
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  generate-bridge:
    needs: [verify-tag]
    # verify-tag etiket disinda atlanir; atlanmasi derlemeyi engellemez, basarisizligi engeller.
    if: ${{ !cancelled() && (needs.verify-tag.result == 'success' || needs.verify-tag.result == 'skipped') }}
    uses: ./.github/workflows/bridge.yml

  windows:
    name: windows-x86_64
    needs: [verify-tag, generate-bridge]
    if: ${{ !cancelled() && needs.generate-bridge.result == 'success' }}
    runs-on: windows-2022
    steps:
      # Etiket derlemesinde surum numarasi etiketten gelir (uygulamaya ve dosya adina gider).
      - name: Set version from tag
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        run: echo "SENSE_VERSION=${{ needs.verify-tag.outputs.version }}" >> "$GITHUB_ENV"

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      # Sense Remote: Dart testleri (kurulum ekrani dahil) Windows PR'larinda da calissin.
      - name: Run the Dart tests
        working-directory: flutter
        run: flutter test --timeout 60s

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: windows-2022

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        shell: bash
        run: |
          if ! $VCPKG_ROOT/vcpkg install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do echo "$_1:"; cat "$_1"; done
            exit 1
          fi

      # Sense Remote: anahtarsiz derleme surer ama panelden gelen hicbir yetki uygulanmaz.
      # G2-9: etiket (yayin) derlemesinde anahtarsizlik hata; k kimlikleri loga yazilir ki
      # panelin GET /signing-key ciktisiyla karsilastirilabilsin (acik anahtar kimligi, sir degil).
      - name: Check panel envelope keys
        shell: bash
        run: |
          if [ -z "$SENSE_ENVELOPE_KEYS" ]; then
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              echo "::error title=SENSE_ENVELOPE_KEYS bos::Yayin (etiket) derlemesi panel anahtari olmadan yapilamaz."
              exit 1
            fi
            echo "::warning title=SENSE_ENVELOPE_KEYS bos::Bu derleme panel zarflarini dogrulayacak anahtar icermiyor; istemci her zarfi reddeder (unknown_key). Yayin oncesi repo degiskenine panelin acik anahtarini yazin."
          else
            echo "SENSE_ENVELOPE_KEYS: $(echo "$SENSE_ENVELOPE_KEYS" | tr ',' '\n' | wc -l) anahtar"
            echo "k: $(echo "$SENSE_ENVELOPE_KEYS" | tr ',' '\n' | cut -d= -f1 | tr -d ' ' | paste -sd' ' -)"
          fi

      - name: Build
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk

      - name: Run the Rust tests
        shell: bash
        run: |
          FEATURES=$(python3 ./build.py --portable --flutter --skip-portable-pack --hwcodec --vram --print-features)
          cargo test --locked --release --lib --features "$FEATURES"

      - name: Build self-extracted executable
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          # Sense Remote: kurulan program SenseRemote.exe (install_me <APP_NAME>.exe bekler).
          mv ./rustdesk/rustdesk.exe ./rustdesk/SenseRemote.exe
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/SenseRemote.exe
          popd
          mkdir -p ./out
          # Sense Remote: kurulum dosyasi adi; "-Kurulum" adi kurulum ekranini acar.
          mv ./target/release/rustdesk-portable-packer.exe ./out/SenseRemote-Kurulum-${{ env.SENSE_VERSION }}.exe

      - name: Run the setup file tests
        shell: bash
        run: cargo test --locked --release -p rustdesk-portable-packer

      - name: Upload Windows build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sense-remote-windows-x86_64
          path: ./out/
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macos-${{ matrix.job.arch }}
    needs: [generate-bridge]
    # Windows oncelikli (karar 2026-11-16): Mac PR'larda calismaz, yalniz master'a
    # gonderimde ve elle (workflow_dispatch) calisir; Mac kirilmasi boylece yine gorulur.
    # Etiket (surum) derlemesi yalniz Windows'tur: macOS surum dosyasi bu asamada yok.
    if: ${{ github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          - { target: aarch64-apple-darwin, os: macos-26, arch: aarch64, extra-build-args: "--screencapturekit" }
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install build runtime
        run: |
          brew install llvm create-dmg
          command -v pkg-config &>/dev/null || brew install pkg-config

      - name: Install NASM
        run: |
          wget --tries=6 --waitretry=20 --retry-connrefused https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/macosx/nasm-2.16.03-macosx.zip
          unzip nasm-2.16.03-macosx.zip
          sudo cp nasm-2.16.03/nasm /usr/local/bin/nasm
          nasm --version

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ matrix.job.arch == 'aarch64' && env.FLUTTER_MACOS_ARM_VERSION || env.FLUTTER_VERSION }}

      - name: Keep CocoaPods for Flutter 3.44 (arm64)
        if: ${{ matrix.job.arch == 'aarch64' }}
        run: flutter config --no-enable-swift-package-manager

      - name: Workaround for flutter issue
        shell: bash
        run: |
          cd "$(dirname "$(which flutter)")"
          sed -i -e 's/_setFramesEnabledState(false);/\/\/_setFramesEnabledState(false);/g' ../packages/flutter/lib/src/scheduler/binding.dart

      - name: Patch RustDesk sources for Flutter 3.44 (arm64)
        if: ${{ matrix.job.arch == 'aarch64' }}
        shell: bash
        run: |
          brew install gnu-sed
          export PATH="$(brew --prefix gnu-sed)/libexec/gnubin:$PATH"
          bash .github/patches/apply_flutter_3.44_source_patches.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.MAC_RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: ${{ matrix.job.os }}

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.job.arch == 'aarch64' && 'bridge-artifact-flutter-3.44' || 'bridge-artifact' }}
          path: ./

      - name: Run the Dart tests
        if: ${{ matrix.job.arch == 'aarch64' }}
        working-directory: flutter
        run: flutter test --timeout 60s

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        run: |
          if ! $VCPKG_ROOT/vcpkg install --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do echo "$_1:"; cat "$_1"; done
            exit 1
          fi

      - name: Build
        run: |
          if [ "${{ matrix.job.target }}" = "aarch64-apple-darwin" ]; then
            MIN_MACOS_VERSION="12.3"
            sed -i -e "s/MACOSX_DEPLOYMENT_TARGET\=[0-9]*.[0-9]*/MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}/" build.py
            sed -i -e "s/platform :osx, '.*'/platform :osx, '${MIN_MACOS_VERSION}'/" flutter/macos/Podfile
            sed -i -e "s/osx_minimum_system_version = \"[0-9]*.[0-9]*\"/osx_minimum_system_version = \"${MIN_MACOS_VERSION}\"/" Cargo.toml
            sed -i -e "s/MACOSX_DEPLOYMENT_TARGET = [0-9]*.[0-9]*;/MACOSX_DEPLOYMENT_TARGET = ${MIN_MACOS_VERSION};/" flutter/macos/Runner.xcodeproj/project.pbxproj
            echo "MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}" >> "$GITHUB_ENV"
          fi
          ./build.py --flutter --hwcodec --unix-file-copy-paste ${{ matrix.job.extra-build-args }}

      - name: Create unsigned dmg
        run: |
          APP="$(ls -d ./flutter/build/macos/Build/Products/Release/*.app | head -1)"
          APP_NAME="$(basename "$APP")"
          CREATE_DMG="$(readlink -f "$(command -v create-dmg)")"
          sed -i -e 's/MAXIMUM_UNMOUNTING_ATTEMPTS=3/MAXIMUM_UNMOUNTING_ATTEMPTS=7/' "$CREATE_DMG"
          mkdir -p out
          create-dmg --icon "$APP_NAME" 200 190 --hide-extension "$APP_NAME" --window-size 800 400 --app-drop-link 600 185 "out/sense-remote-${{ env.VERSION }}-${{ matrix.job.arch }}-unsigned.dmg" "$APP"

      - name: Upload macOS build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sense-remote-macos-${{ matrix.job.arch }}
          path: out/*.dmg
          if-no-files-found: error
          retention-days: 14

  # Etiket: SHA-256 uret, herkese ACIK OLMAYAN taslak GitHub surumu olustur (yayinlamak insan adimi).
  release-draft:
    name: draft release
    needs: [verify-tag, windows]
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download Windows build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sense-remote-windows-x86_64
          path: ./release

      - name: Checksums and draft release
        shell: bash
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify-tag.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          FILE="SenseRemote-Kurulum-${VERSION}.exe"
          [ -f "$FILE" ] || { echo "::error::$FILE bulunamadi"; ls -la; exit 1; }
          sha256sum "$FILE" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          # --draft: herkese acik degil; yayinlamayi ekip elle yapar.
          gh release create "$TAG" "$FILE" SHA256SUMS.txt \
            --repo "$REPO" --draft --verify-tag \
            --title "Sense Remote ${VERSION}" \
            --notes "Taslak. Imzasiz Windows kurulum dosyasi; dogrulama icin SHA256SUMS.txt. Surum notlari yayindan once eklenir."
