# Sense Remote: golden görüntülerini güncelle (İnşa planı §5). Yerelde Flutter yok; görüntüler
# burada üretilir. Yalnız elle çalışır: Actions > "Sense Remote golden" > "Use workflow from"
# kutusundan GÜNCELLENECEK DAL seçilir (iş akışı dosyası o dalda bulunmalı; yoksa dala master
# birleştirilir). Dal adı girdi olarak değil seçilen ref olarak alınır, çünkü bridge.yml
# (flutter-rust-bridge dosyaları) da aynı ref'i derler; girdi ile ref ayrışırsa görüntüler
# yanlış kodla üretilirdi.
# İş yalnız flutter/test/goldens/*.png dosyalarını aynı dala commit'ler. GITHUB_TOKEN ile
# gelen push PR kontrolünü kendiliğinden tetiklemez; commit sonrası "PR kontrolu"nu elle başlatın
# (Actions > Sense Remote PR > Run workflow, pr = PR numarası).
# Görüntüleri prototiple karşılaştırıp kabul eden ana oturumdur; iş yalnız üretir.
name: Sense Remote golden

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sense-golden-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.24.5"

jobs:
  guard:
    name: branch check
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      # Varsayılan dala (master) hiçbir zaman doğrudan yazılmaz.
      - name: Refuse the default branch
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          [ "$REF_TYPE" = branch ] || { echo "::error::Bir dal seçin (etiket olmaz)."; exit 1; }
          [ "$REF_NAME" != "$DEFAULT_BRANCH" ] || { echo "::error::Varsayılan dala yazılmaz; bir çalışma dalı seçin."; exit 1; }
          echo "Dal: $REF_NAME"

  generate-bridge:
    needs: [guard]
    uses: ./.github/workflows/bridge.yml

  golden:
    name: update goldens
    needs: [guard, generate-bridge]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Yalnız bu işte push gerekir.
          persist-credentials: true

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # sense-pr.yml'deki yamanın aynısı.
      - name: Patch flutter
        shell: bash
        run: |
          patch="$PWD/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff"
          cd "$(dirname "$(dirname "$(which flutter)")")"
          if git apply --check "$patch" 2>/dev/null; then
            git apply "$patch"
          else
            git apply -R --check "$patch"
            echo "Yama zaten uygulanmış."
          fi

      # Yalnız Sense testleri; golden'ı olmayanlar da koşar ama dosya üretmez.
      - name: Update the Sense goldens
        working-directory: flutter
        run: flutter test --update-goldens --timeout 60s test/sense_*_test.dart

      - name: Commit changed goldens
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git add --all -- flutter/test/goldens
          if git diff --cached --quiet; then
            {
              echo "### Golden güncelleme: $BRANCH"
              echo "Değişen görüntü yok; commit atılmadı."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git diff --cached --name-status -- flutter/test/goldens > "$RUNNER_TEMP/changed.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Golden görüntülerini güncelle (sense-golden iş akışı)"
          git push origin "HEAD:refs/heads/$BRANCH"
          {
            echo "### Golden güncelleme: $BRANCH"
            echo "Commit: $(git rev-parse --short HEAD)"
            echo
            echo "| Durum | Dosya |"
            echo "| --- | --- |"
            while IFS=$'\t' read -r st f; do echo "| $st | $f |"; done < "$RUNNER_TEMP/changed.txt"
            echo
            echo "A = yeni, M = değişti, D = silindi. Görüntüleri prototiple karşılaştırıp kabul edin."
          } >> "$GITHUB_STEP_SUMMARY"
